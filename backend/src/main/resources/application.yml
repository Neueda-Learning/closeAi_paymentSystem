server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== LangChain4j AI Agent (Layer 3 — requires API key) =====
# 切换底座模型只需改 base-url + model-name, 代码零改动
langchain4j:
  open-ai:
    chat-model:
      # 默认 OpenAI; 阿里百炼: https://dashscope.aliyuncs.com/compatible-mode/v1
      # Ollama 本地: http://localhost:11434/v1
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${LLM_API_KEY:sk-demo}
      model-name: ${LLM_MODEL_NAME:gpt-4o-mini}
      temperature: 0.1
      max-tokens: 1024
      log-requests: true
      log-responses: true
      timeout: 60s

# ===== Risk Assessment (three-layer progressive) =====
risk:
  layer1:
    enabled: true
    large-amount-block: 1000000
    large-amount-warning: 100000
    night-time-start: 0
    night-time-end: 5
    self-transfer-score: 50
    new-payee-score: 30
    velocity-score: 35
  layer2:
    enabled: true
    zscore-threshold: 3.0
    iqr-multiplier: 1.5
    velocity-deviation: 5
  layer3:
    enabled: false
    timeout-seconds: 30
    max-retries: 2
  thresholds:
    block: 60
    review: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
